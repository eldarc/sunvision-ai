<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#1e1e1e" />
    <script>
      // Set the theme before anything paints (no flash of the wrong theme). Mirrors lib/theme.ts:
      // localStorage 'sv.theme' ('light' | 'dark' | 'system'), else prefers-color-scheme.
      (function () {
        var t = 'dark';
        try {
          var p = localStorage.getItem('sv.theme');
          if (p === 'light' || p === 'dark') t = p;
          else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) t = 'light';
        } catch (e) {
          try { if (window.matchMedia('(prefers-color-scheme: light)').matches) t = 'light'; } catch (e2) {}
        }
        var d = document.documentElement;
        d.setAttribute('data-theme', t);
        d.style.colorScheme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'light' ? '#f5f5f5' : '#1e1e1e');
      })();
    </script>
    <title>sunvisionai — See the sunlight before you move in</title>
    <meta name="description" content="sunvisionai — see the sunlight before you move in. One street photo becomes an editable 3D twin of the building, with ray-traced direct sunlight for every apartment window." />
    <meta name="application-name" content="sunvisionai" />
    <meta name="apple-mobile-web-app-title" content="sunvisionai" />
    <meta property="og:site_name" content="sunvisionai" />
    <meta property="og:title" content="sunvisionai — See the sunlight before you move in" />
    <meta property="og:description" content="One street photo becomes an editable 3D twin of the building, with ray-traced direct sunlight for every apartment window." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sunvisionai.com/" />
    <link rel="canonical" href="https://sunvisionai.com/" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
