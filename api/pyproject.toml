[project]
name = "sunvision-cv"
version = "1.0.0"
description = "Sunvision computer vision backend: Roboflow RF-DETR facade segmentation, Supervision processing, depth estimation"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "inference-sdk>=0.30",
  "supervision>=0.25",
  "opencv-python-headless>=4.9",
  "numpy>=1.26",
  "pillow>=10",
  "pydantic>=2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
depth = ["torch>=2.3", "torchvision>=0.18", "transformers>=4.45"]
local = ["inference"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sunvision_cv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
